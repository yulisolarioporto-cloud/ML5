<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador d 5 cosas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <script>
        let classifier; 
        let imageModelURL = './models2/'; 
        let video;
        let listaPredicciones = []; 
        const colores = ['orange', 'red', 'purple', 'blue', 'gold'];

        function preload(){
            classifier = ml5.imageClassifier(imageModelURL + 'model.json');
        }

        function setup(){
            createCanvas(640, 260);
            video = createCapture(VIDEO);
            video.size(320, 260);
            video.hide();
            classifyVideo();
        }

        function draw(){
            background(255); 
            image(video, 0, 0);

            if (listaPredicciones.length === 0) return;

            let xInicio = 340;
            let yInicio = 30;
            let anchoMaximo = 180;

            for (let i = 0; i < listaPredicciones.length; i++) {
                let objeto = listaPredicciones[i];
                let yPos = yInicio + (i * 40);
                let colorActual = colores[i % colores.length];

                fill(colorActual);
                noStroke();
                textSize(14);
                text(objeto.label, xInicio, yPos + 14);

                fill(230);
                rect(xInicio + 100, yPos, anchoMaximo, 18, 5);

                fill(colorActual);
                rect(xInicio + 100, yPos, objeto.confidence * anchoMaximo, 18, 5);
            }
        }

        function classifyVideo(){
            classifier.classify(video, gotResult);
        }

        function gotResult(error, result){
            if (!error) {
                listaPredicciones = result;
                classifyVideo();
            }
        }
    </script>

</body>
</html>
