<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Librería p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- Librería ml5.js -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <title>HandPose Imagen</title>
</head>

<body>

<script>

//Variables
let handPose
let img
let hands = []

//Asignar el modelo
function preload(){
    img = loadImage("./images/mano.jpg")
    handPose = ml5.handPose()
}

//Construir/gestionar UI
function setup(){
    //Renderizar la imagen
    createCanvas(640, 480)
    image(img, 0, 0)

    //Iniciar detección manos
    handPose.detectStart(img, gotHands)
}

//Render
function draw(){

    //Mostrar nuevamente la imagen
    image(img, 0, 0)

    //Recorrer manos detectadas
    for(let i = 0; i < hands.length; i++){

        let hand = hands[i]

        //Recorrer puntos de la mano
        for(let j = 0; j < hand.keypoints.length; j++){

            //Primer punto de la mano
            let keypoint = hand.keypoints[j]

            fill(0, 255, 0) //RGB
            noStroke() //Sin borde

            //EjeX, EjeY, Radio
            circle(keypoint.x, keypoint.y, 10)
        }
    }
}

//Resultados
function gotHands(result){

    //Retorna un array con la información de la mano/dedos
    hands = result
}

</script>

</body>
</html>
