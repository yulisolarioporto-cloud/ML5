<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador con Gráfico de Barras</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js"></script>
</head>
<body>

    <div style="margin-bottom: 10px;">
        <label for="descripcion">Detectado: </label>
        <input type="text" id="descripcion" readonly>
        
        <label for="confianza">Confianza: </label>
        <input type="text" id="confianza" readonly>
    </div>

    <script>
        let classifier; 
        let imageModelURL = './models2/'; // Tu ruta de modelos corregida

        let video;
        let flippedVideo;
        
        // Aquí guardaremos la lista completa de predicciones (los 5 objetos)
        let listaPredicciones = []; 

        function preload(){
            classifier = ml5.imageClassifier(imageModelURL + 'model.json');
        }

        function setup(){
            // Ampliamos el canvas a 640 de ancho: 320 para el video y 320 para el gráfico
            createCanvas(640, 260);

            video = createCapture(VIDEO);
            video.size(320, 260);
            video.hide();

            classifyVideo();
        }

        function draw(){
            background(245); // Un fondo gris claro limpio

            // 1. Dibujar el espejo de la cámara (Lado Izquierdo: x = 0)
            flippedVideo = ml5.flipImage(video);
            image(flippedVideo, 0, 0);
            flippedVideo.remove(); 

            // 2. Dibujar el Gráfico de Barras (Lado Derecho: x = 340)
            dibujarGraficoBarras(340, 30);
        }

        function classifyVideo(){
            classifier.classify(video, gotResult);
        }

        function gotResult(error, results){
            if (error){
                console.error(error);
                return;
            }

            // Guardamos todo el array de resultados (contiene las 5 clases y sus confianzas)
            listaPredicciones = results;

            // Actualizamos los inputs de texto clásicos con el ganador
            document.getElementById('descripcion').value = results[0].label;
            document.getElementById('confianza').value = (results[0].confidence * 100).toFixed(2) + '%';

            classifyVideo();
        }

        // Función personalizada para pintar el gráfico con p5.js
        function dibujarGraficoBarras(xInicio, yInicio) {
            push(); // Protege los estilos previos de p5
            
            // Título del gráfico
            fill(50);
            noStroke();
            textSize(14);
            textStyle(BOLD);
            text("Nivel de Confianza por Objeto", xInicio, yInicio - 10);

            if (listaPredicciones.length === 0) {
                pop();
                return;
            }

            let anchoMaximoBarra = 160; 
            let altoBarra = 20;
            let espacioEntreBarras = 35;

            for (let i = 0; i < listaPredicciones.length; i++) {
                let objeto = listaPredicciones[i];
                let yPos = yInicio + (i * espacioEntreBarras);

                let anchoBarra = objeto.confidence * anchoMaximoBarra;

                if (i === 0) {
                    fill(46, 204, 113); 
                } else {
                    fill(52, 152, 219); 
                }

                // Dibujar la barra de datos
                noStroke();
                rect(xInicio + 100, yPos, anchoBarra, altoBarra, 4); // El '4' redondea las esquinas

                // Colocar la etiqueta del objeto (Alineada a la izquierda de la barra)
                fill(70);
                textStyle(NORMAL);
                textSize(12);
                textAlign(RIGHT, CENTER);
                text(objeto.label, xInicio + 90, yPos + (altoBarra / 2));

                // Colocar el porcentaje de texto numérico (A la derecha de la barra)
                textAlign(LEFT, CENTER);
                fill(100);
                let porcentaje = (objeto.confidence * 100).toFixed(1) + '%';
                text(porcentaje, xInicio + 105 + anchoBarra, yPos + (altoBarra / 2));
            }

            pop(); // Restaura los estilos
        }
    </script>
</body>
</html>
