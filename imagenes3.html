<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clasificador de Dibujos - DoodleNet</title>
  
  <!-- Cargamos la librería de p5.js para el lienzo y dibujo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- Cargamos la librería de ml5.js para la Inteligencia Artificial -->
  <script src="https://unpkg.com/ml5@1.2.0/dist/ml5.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #d6eaf8;
    }
    /* Estilo simple para resaltar el borde del lienzo */
    canvas {
      border: 2px solid #c9d1fc;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    p {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <script>
    
    let classifier;
    let clearButton; 
    let resultsP; 
    let canvas; 

    // Se ejecuta antes que todo, carga el modelo DoodleNet
    function preload() {
      classifier = ml5.imageClassifier("DoodleNet");
    }

    // Configura el estado inicial
    function setup() {
      canvas = createCanvas(280, 280);
      background(255);
      
      // Analiza el lienzo en tiempo real y pasa los resultados a gotResult
      classifier.classifyStart(canvas, gotResult);

      // Crea el párrafo de texto para los resultados
      resultsP = createP("Esperando dibujo...");
      
      // Crea el botón para limpiar el lienzo
      clearButton = createButton("Clear Canvas");
      clearButton.mousePressed(clearCanvas);
    }

    // Limpia el lienzo pintándolo de blanco otra vez
    function clearCanvas() {
      background(255);
    }

    // Bucle de dibujo (detecta el mouse y traza las líneas)
    function draw() {
      strokeWeight(16);
      stroke(0);
      if (mouseIsPressed) {
        line(pmouseX, pmouseY, mouseX, mouseY);
      }
    }

    // Se ejecuta automáticamente cuando la IA obtiene un resultado
    function gotResult(results) {
      if (results && results.length > 0) {
        let label = results[0].label;
        let confidence = results[0].confidence;
        
        // Muestra la etiqueta y la confianza formateada a 2 decimales
        resultsP.html(label + " (Confianza: " + nf(confidence * 100, 0, 2) + "%)");
      }
    }
  </script>

</body>
</html>
